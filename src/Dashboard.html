<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>EmailSpamdetection</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1c2230; --muted:#5b6474; --line:#e2e5ea; --accent:#1f6feb; --accent-ink:#fff;
          --danger:#c62828; --danger-bg:#fdecea; --warn:#9a5b00; --warn-bg:#fff4e0; --ok:#2e7d32; --ok-bg:#e8f5e9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1218; --card:#171b23; --ink:#e7eaf0; --muted:#9aa3b2; --line:#2a303b; --accent:#5b9cff; --accent-ink:#0b1020;
            --danger:#ff7b7b; --danger-bg:#3a1d1d; --warn:#f0b35a; --warn-bg:#3a2c14; --ok:#6fd38a; --ok-bg:#16301d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid var(--line); }
  .bar { display:flex; align-items:center; gap:10px; padding:10px 14px; max-width:880px; margin:0 auto; }
  .bar h1 { font-size:17px; margin:0; flex:1; }
  nav { display:flex; gap:4px; overflow-x:auto; padding:0 10px 8px; max-width:880px; margin:0 auto; }
  nav button { border:0; background:none; color:var(--muted); padding:8px 11px; border-radius:8px; font:inherit; white-space:nowrap; cursor:pointer; }
  nav button[aria-selected="true"] { background:var(--bg); color:var(--ink); font-weight:600; }
  main { padding:14px; max-width:880px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .card h2 { font-size:16px; margin:0 0 6px; }
  .muted { color:var(--muted); }
  .small { font-size:13px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .row.end { justify-content:flex-end; }
  .grow { flex:1; min-width:0; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:12px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .tile b { display:block; font-size:24px; }
  .pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; }
  .pill.ok { background:var(--ok-bg); color:var(--ok); } .pill.warn { background:var(--warn-bg); color:var(--warn); }
  .pill.bad { background:var(--danger-bg); color:var(--danger); } .pill.plain { background:var(--bg); color:var(--muted); }
  .btn { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:9px; padding:8px 12px; font:inherit; cursor:pointer; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.danger { border-color:var(--danger); color:var(--danger); }
  .btn:disabled { opacity:.55; cursor:default; }
  a.btn { text-decoration:none; display:inline-block; }
  ul.reasons { margin:6px 0 0; padding-left:18px; font-size:13px; color:var(--muted); }
  .item { border-top:1px solid var(--line); padding:12px 0; } .item:first-of-type { border-top:0; padding-top:4px; }
  .subject { font-weight:600; word-break:break-word; } .from { font-size:13px; color:var(--muted); word-break:break-all; }
  input[type=text], input[type=password], input[type=number], input[type=search], select {
    font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); min-width:0; }
  label.field { display:flex; justify-content:space-between; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  label.field:first-of-type { border-top:0; }
  .secret { display:flex; gap:6px; }
  #toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 14px;
           border-radius:10px; max-width:90vw; font-size:14px; z-index:20; }
  #toast.error { background:var(--danger); color:#fff; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:30; padding:16px; }
  #modal .sheet { background:var(--card); color:var(--ink); border-radius:14px; padding:18px; max-width:420px; width:100%; }
  #modal h2 { margin:0 0 8px; font-size:17px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <div class="bar"><h1>EmailSpamdetection</h1><span id="status" class="pill plain">Loading</span></div>
  <nav role="tablist" aria-label="Sections">
    <button role="tab" data-tab="home">Home</button>
    <button role="tab" data-tab="quarantine">Quarantine</button>
    <button role="tab" data-tab="review">To remove</button>
    <button role="tab" data-tab="websites">Websites</button>
    <button role="tab" data-tab="outbox">Outbox &amp; drafts</button>
    <button role="tab" data-tab="settings">Settings</button>
  </nav>
</header>
<main id="view" aria-live="polite"></main>
<div id="toast" role="status" hidden></div>
<div id="modal" hidden></div>
<script>
'use strict';
// Safety rule for this page: everything that comes from an email (names, subjects, reasons, links) is
// put on the page as plain text with textContent, never as HTML, so an email cannot run code here.
var state = { tab: 'home', websites: null, filter: 'suggested', query: '', shown: 50 };

function h(tag, attrs) {
  var el = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (k) {
    var v = attrs[k];
    if (v === null || v === undefined || v === false) return;
    if (k === 'text') el.textContent = String(v);
    else if (k === 'class') el.className = v;
    else if (k.indexOf('on') === 0 && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'href') { if (safeHref(v)) { el.setAttribute('href', v); el.setAttribute('rel', 'noopener noreferrer'); el.setAttribute('target', '_blank'); } }
    else if (/^[a-z][a-z0-9-]*$/.test(k) && k.indexOf('on') !== 0) el.setAttribute(k, String(v));
  });
  for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
  return el;
}
function add(el, kid) {
  if (kid === null || kid === undefined || kid === false) return;
  if (Array.isArray(kid)) { kid.forEach(function (k) { add(el, k); }); return; }
  el.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
}
function safeHref(u) { return typeof u === 'string' && /^https:\/\/[^\s"'<>\\`]+$/i.test(u); }

function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    var runner = google.script.run
      .withSuccessHandler(function (r) { if (r && r.ok) resolve(r.data); else reject(new Error((r && r.error) || 'Something went wrong.')); })
      .withFailureHandler(function () { reject(new Error('Could not reach your Google account. Check your connection and try again.')); });
    runner[fn].apply(runner, args);
  });
}

var toastTimer = null;
function toast(msg, isError) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = isError ? 'error' : ''; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 4500);
}
function confirmBox(title, text, okLabel, danger) {
  return new Promise(function (resolve) {
    var m = document.getElementById('modal');
    function done(v) { m.hidden = true; m.replaceChildren(); resolve(v); }
    m.replaceChildren(h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'mtitle' },
      h('h2', { id: 'mtitle', text: title }), h('p', { text: text }),
      h('div', { class: 'row end' },
        h('button', { class: 'btn', onclick: function () { done(false); } }, 'Cancel'),
        h('button', { class: danger ? 'btn danger' : 'btn primary', onclick: function () { done(true); } }, okLabel))));
    m.hidden = false;
  });
}
// Runs an action with its button disabled, and shows the result or the error.
function act(btn, promise, okMessage) {
  if (btn) btn.disabled = true;
  return promise.then(function (r) { if (okMessage) toast(typeof okMessage === 'function' ? okMessage(r) : okMessage); return r; })
    .catch(function (e) { toast(e.message, true); throw e; })
    .finally(function () { if (btn) btn.disabled = false; });
}
function when(ms) {
  if (!ms) return '';
  var d = Date.now() - ms, m = Math.round(d / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  if (m < 1440) return Math.round(m / 60) + ' h ago';
  return new Date(ms).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
}
function view() { return document.getElementById('view'); }
function show() { var v = view(); v.replaceChildren(); for (var i = 0; i < arguments.length; i++) add(v, arguments[i]); }
function loading(what) { show(h('div', { class: 'card muted', text: 'Loading ' + what + '...' })); }
function failed(e) { show(h('div', { class: 'card' }, h('h2', { text: 'Could not load this' }), h('p', { class: 'muted', text: e.message }))); }

/* ---------- Home ---------- */
function renderHome() {
  loading('your overview');
  call('apiOverview').then(function (o) {
    var status = document.getElementById('status');
    status.textContent = o.protectionOn ? 'Protected' : 'Off'; status.className = 'pill ' + (o.protectionOn ? 'ok' : 'bad');
    var checkBtn = h('button', { class: 'btn primary' }, 'Check my inbox now');
    checkBtn.addEventListener('click', function () {
      act(checkBtn, call('apiCheckNow'), function (r) { return r.acted ? r.acted + ' risky email(s) moved out of your inbox.' : 'Checked ' + r.checked + ' conversations: nothing risky.'; })
        .then(renderHome).catch(function () {});
    });
    show(
      h('div', { class: 'card' },
        h('h2', { text: o.protectionOn ? 'Your inbox is protected' : 'Protection is off' }),
        h('p', { class: 'muted', text: o.protectionOn
          ? 'New mail is checked every ' + o.checkEveryMinutes + ' minutes' + (o.lastCheck ? ' (last check ' + when(o.lastCheck) + ').' : '.') + ' Risky emails go to Quarantine. Nothing is deleted without you.'
          : 'Open the Apps Script editor from your sheet (Extensions > Apps Script) and run "setup" to switch it on.' }),
        h('div', { class: 'row' }, checkBtn, h('span', { class: 'muted small', text: 'Also re-checks the last 30 days of your inbox.' }))),
      h('div', { class: 'tiles' },
        tile(o.dangerous, 'Dangerous', 'quarantine'), tile(o.checkFirst, 'Check first', 'quarantine'),
        tile(o.caughtThisWeek, 'Caught this week', 'quarantine'), tile(o.toReview, 'Waiting for your review', 'review'),
        tile(o.websites, 'Websites and lists', 'websites')),
      alertsCard(o.alerts),
      h('div', { class: 'card small muted', text: o.scanDone ? 'Websites list: complete.' :
        'Websites list: still reading your older mail' + (o.scanCursor ? ' (now at ' + new Date(o.scanCursor).toLocaleDateString(undefined, { month: 'long', year: 'numeric' }) + ')' : '') + '. This runs in the background.' }),
      h('p', { class: 'muted small', text: 'Version ' + o.version + ' · signed in as ' + o.owner })
    );
  }).catch(failed);
}
function tile(n, label, tab) {
  return h('button', { class: 'tile', style: 'text-align:left;cursor:pointer;font:inherit;color:inherit', onclick: function () { go(tab); } },
    h('b', { text: String(n) }), h('span', { class: 'muted small', text: label }));
}
function alertsCard(alerts) {
  if (!alerts || !alerts.length) return null;
  return h('div', { class: 'card', style: 'border-color:var(--danger)' },
    h('h2', { text: 'Check your account' }),
    h('p', { class: 'small', text: 'Something unusual left your account. If you did not do this, change your Google password now, then check signed-in devices and your Gmail forwarding settings.' }),
    alerts.map(function (a) {
      return h('div', { class: 'item' }, h('div', { class: 'subject', text: a.kind }), h('div', { class: 'from', text: when(a.at) + ' · ' + a.detail }));
    }));
}

/* ---------- Quarantine ---------- */
function renderQuarantine() {
  loading('quarantine');
  call('apiQuarantine').then(function (q) {
    show(
      h('div', { class: 'card' }, h('h2', { text: 'Dangerous' }),
        h('p', { class: 'muted small', text: "Don't open links or attachments in these. They are out of your inbox and nothing was deleted." }),
        q.dangerous.length ? q.dangerous.map(quarantineItem) : h('p', { class: 'muted', text: 'Nothing here.' })),
      h('div', { class: 'card' }, h('h2', { text: 'Check first' }),
        h('p', { class: 'muted small', text: 'These looked suspicious. Read the reasons, then decide.' }),
        q.check.length ? q.check.map(quarantineItem) : h('p', { class: 'muted', text: 'Nothing here.' })));
  }).catch(failed);
}
function quarantineItem(t) {
  var trust = h('input', { type: 'checkbox', id: 'trust-' + t.id });
  var box = h('div', { class: 'item' },
    h('div', { class: 'subject', text: t.subject }),
    h('div', { class: 'from', text: t.from + ' · ' + when(t.date) }),
    t.reasons ? h('ul', { class: 'reasons' }, t.reasons.split('; ').map(function (r) { return h('li', { text: r }); })) : null,
    h('div', { class: 'row', style: 'margin-top:8px' },
      button('It is safe: back to inbox', '', function (b) { return act(b, call('apiQuarantineAction', t.id, 'restore', trust.checked), 'Moved back to your inbox.'); }),
      h('label', { class: 'small muted', for: 'trust-' + t.id }, trust, ' always trust this sender'),
      button('Report spam', '', function (b) { return act(b, call('apiQuarantineAction', t.id, 'spam', false), 'Reported as spam.'); }),
      button('Remove', 'danger', function (b) {
        return confirmBox('Remove this email?', 'It goes to Trash, where you can restore it for 30 days.', 'Remove', true)
          .then(function (ok) { if (ok) return act(b, call('apiQuarantineAction', t.id, 'remove', false), 'Moved to Trash.'); });
      })));
  return box;
}
function button(label, kind, onClick, after) {
  var b = h('button', { class: 'btn ' + (kind || '') }, label);
  b.addEventListener('click', function () {
    Promise.resolve(onClick(b)).then(function (r) { if (r !== undefined) (after || refresh)(); }).catch(function () {});
  });
  return b;
}

/* ---------- To remove ---------- */
function renderReview() {
  loading('your review list');
  call('apiReview').then(function (items) {
    var open = items.filter(function (i) { return !i.decision; });
    var decided = items.filter(function (i) { return i.decision; });
    show(
      h('div', { class: 'card' }, h('h2', { text: 'Review before removing' }),
        h('p', { class: 'muted small', text: 'Nothing is removed until you press Remove. Removed emails go to Trash, where you can restore them for 30 days. Starred, important and labelled emails are never included.' })),
      open.length ? open.map(reviewItem) : h('div', { class: 'card muted', text: 'Nothing waiting for you. New suggestions appear after the nightly check.' }),
      decided.length ? h('div', { class: 'card' }, h('h2', { text: 'Already decided' }), decided.map(reviewItem)) : null);
  }).catch(failed);
}
function reviewItem(i) {
  var range = i.oldest ? when(i.oldest) + ' to ' + when(i.newest) : '';
  return h('div', { class: i.decision ? 'item' : 'card' },
    h('div', { class: 'subject', text: i.what }),
    h('div', { class: 'from', text: i.count + ' emails' + (range ? ' · ' + range : '') }),
    h('p', { class: 'small', text: i.why }),
    i.examples ? h('p', { class: 'muted small', text: 'For example: ' + i.examples }) : null,
    i.status ? h('p', { class: 'small' }, h('span', { class: 'pill plain', text: i.status })) : null,
    h('div', { class: 'row' },
      i.link ? h('a', { class: 'btn', href: i.link }, 'See them in Gmail') : null,
      !i.decision ? button('Remove', 'danger', function (b) {
        return confirmBox('Remove ' + i.count + ' emails?', i.what + '. They go to Trash, where you can restore them for 30 days.', 'Remove', true)
          .then(function (ok) { if (ok) return act(b, call('apiReviewDecision', i.key, 'remove'), function (s) { return s || 'Removing.'; }); });
      }) : null,
      !i.decision ? button('Keep', '', function (b) { return act(b, call('apiReviewDecision', i.key, 'keep'), 'Kept.'); }) : null,
      i.decision ? button('Undo', '', function (b) { return act(b, call('apiReviewDecision', i.key, 'undo'), 'Undone.'); }) : null));
}

/* ---------- Websites ---------- */
function renderWebsites(reload) {
  if (state.websites && !reload) { drawWebsites(); return; }
  loading('your websites');
  call('apiWebsites').then(function (rows) { state.websites = rows; state.shown = 50; drawWebsites(); }).catch(failed);
}
function drawWebsites() {
  var rows = state.websites || [];
  var q = state.query.toLowerCase();
  var list = rows.filter(function (r) {
    if (q && (r.site + ' ' + r.name + ' ' + r.email).toLowerCase().indexOf(q) < 0) return false;
    if (state.filter === 'suggested') return !!r.suggestion;
    if (state.filter === 'lists') return r.type.indexOf('Mailing list') >= 0;
    if (state.filter === 'accounts') return r.type.indexOf('Account') >= 0;
    return true;
  });
  var search = h('input', { type: 'search', placeholder: 'Search websites', value: state.query, 'aria-label': 'Search websites', class: 'grow' });
  search.addEventListener('input', function () { state.query = search.value; state.shown = 50; drawWebsites(); search.focus(); });
  function chip(id, label) {
    return h('button', { class: 'btn' + (state.filter === id ? ' primary' : ''), onclick: function () { state.filter = id; state.shown = 50; drawWebsites(); } }, label);
  }
  show(
    h('div', { class: 'card' },
      h('h2', { text: rows.length + ' websites and mailing lists email you' }),
      h('p', { class: 'muted small', text: 'Unsubscribe from what you never open. For spam, use Block instead: unsubscribing from spammers only confirms your address.' }),
      h('div', { class: 'row' }, search),
      h('div', { class: 'row', style: 'margin-top:8px' }, chip('suggested', 'Suggested'), chip('lists', 'Mailing lists'), chip('accounts', 'Accounts'), chip('all', 'All'))),
    h('div', { class: 'card' },
      list.length ? list.slice(0, state.shown).map(websiteItem) : h('p', { class: 'muted', text: 'Nothing matches.' }),
      list.length > state.shown ? h('button', { class: 'btn', onclick: function () { state.shown += 50; drawWebsites(); } }, 'Show more') : null));
}
function websiteItem(r) {
  var linkSlot = h('span');
  var done = function () { renderWebsites(true); };
  return h('div', { class: 'item' },
    h('div', { class: 'row' }, h('span', { class: 'subject grow', text: r.site }), r.suggestion ? h('span', { class: 'pill warn', text: r.suggestion }) : null),
    h('div', { class: 'from', text: (r.name ? r.name + ' · ' : '') + r.email }),
    h('div', { class: 'small muted', text: r.type + ' · ' + r.emails + ' emails · opened ' + r.opened + '%' + (r.last ? ' · last ' + when(r.last) : '') }),
    r.status ? h('div', { class: 'small' }, h('span', { class: 'pill plain', text: r.status })) : null,
    h('div', { class: 'row', style: 'margin-top:6px' },
      r.unsub ? button('Unsubscribe', '', function (b) {
        return act(b, call('apiWebsiteAction', r.email, 'unsubscribe')).then(function (res) {
          if (res.link) { linkSlot.replaceChildren(h('a', { class: 'btn primary', href: res.link }, 'Open the unsubscribe page')); toast('Finish on their page.'); return undefined; }
          toast('Unsubscribed.'); return res;
        });
      }, done) : null,
      button('Remove their emails', '', function (b) {
        return act(b, call('apiCountFrom', r.email)).then(function (n) {
          return confirmBox('Remove ' + n + ' emails from ' + r.email + '?', 'They go to Trash, where you can restore them for 30 days.', 'Remove', true)
            .then(function (ok) { if (ok) return act(b, call('apiWebsiteAction', r.email, 'remove'), 'Removing.'); });
        });
      }, done),
      button('Block', 'danger', function (b) {
        return confirmBox('Block ' + r.email + '?', 'Their old emails go to Trash and new ones are removed when they arrive.', 'Block', true)
          .then(function (ok) { if (ok) return act(b, call('apiWebsiteAction', r.email, 'block'), 'Blocked.'); });
      }, done),
      button('Keep', '', function (b) { return act(b, call('apiWebsiteAction', r.email, 'keep'), 'Kept.'); }, done),
      linkSlot));
}

/* ---------- Outbox & drafts ---------- */
function renderOutbox() {
  loading('your outbox');
  call('apiOutgoing').then(function (o) {
    var old = o.drafts.filter(function (d) { return d.old; });
    var picks = {};
    var del = h('button', { class: 'btn danger', disabled: true }, 'Delete selected');
    function count() { var n = Object.keys(picks).length; del.disabled = !n; del.textContent = n ? 'Delete ' + n + ' selected' : 'Delete selected'; }
    del.addEventListener('click', function () {
      var ids = Object.keys(picks);
      confirmBox('Delete ' + ids.length + ' drafts?', 'Deleted drafts cannot be brought back.', 'Delete', true).then(function (ok) {
        if (ok) act(del, call('apiDeleteDrafts', ids), function (n) { return n + ' drafts deleted.'; }).then(renderOutbox).catch(function () {});
      });
    });
    show(
      alertsCard(o.alerts) || h('div', { class: 'card' }, h('h2', { text: 'Nothing unusual' }),
        h('p', { class: 'muted small', text: 'Your sent mail, drafts and scheduled emails are checked for signs that someone else is using your account: mass emails, risky attachments or links.' })),
      h('div', { class: 'card' }, h('h2', { text: 'Scheduled to send' }),
        o.scheduled.length ? o.scheduled.map(function (s) {
          return h('div', { class: 'item' }, h('div', { class: 'subject', text: s.subject }), h('div', { class: 'from', text: 'To ' + s.to + ' (' + s.recipients + ' people)' }));
        }) : h('p', { class: 'muted', text: 'Nothing scheduled.' })),
      h('div', { class: 'card' }, h('h2', { text: 'Old drafts (' + old.length + ')' }),
        h('p', { class: 'muted small', text: 'Drafts older than ' + o.draftDays + ' days. Pick the ones you will never send. ' + (o.drafts.length - old.length) + ' newer drafts are not shown.' }),
        old.length ? old.map(function (d) {
          var box = h('input', { type: 'checkbox', id: 'd-' + d.id, 'aria-label': 'Select draft' });
          box.addEventListener('change', function () { if (box.checked) picks[d.id] = 1; else delete picks[d.id]; count(); });
          return h('div', { class: 'item row' }, box,
            h('label', { for: 'd-' + d.id, class: 'grow' }, h('div', { class: 'subject', text: d.subject }),
              h('div', { class: 'from', text: (d.to ? 'To ' + d.to + ' · ' : '') + when(d.date) })));
        }) : h('p', { class: 'muted', text: 'No old drafts.' }),
        old.length ? h('div', { class: 'row end' }, del) : null));
  }).catch(failed);
}

/* ---------- Settings ---------- */
var FIELDS = [
  ['checkEveryMinutes', 'Check my inbox every (minutes)', 'select', [1, 5, 10, 15]],
  ['dangerousScore', 'Score for "Dangerous" (50-100)', 'number'],
  ['suspiciousScore', 'Score for "Check first" (20-90)', 'number'],
  ['dangerousToSpam', 'Send dangerous emails straight to Spam', 'bool'],
  ['promoDays', 'Suggest removing promotions older than (days)', 'number'],
  ['socialDays', 'Suggest removing social alerts older than (days)', 'number'],
  ['codeDays', 'Suggest removing login codes older than (days)', 'number'],
  ['draftDays', 'Offer to delete drafts older than (days)', 'number'],
  ['scanYears', 'Websites list: read mail from the last (years)', 'number'],
  ['massRecipients', 'Alert me when one email I send goes to (people)', 'number'],
  ['maxSentPerHour', 'Alert me when I send this many emails in an hour', 'number'],
  ['alertEmails', 'Email me when my outbox looks hacked', 'bool']
];
function renderSettings() {
  loading('settings');
  call('apiSettings').then(function (s) {
    var inputs = {};
    var form = h('div', { class: 'card' }, h('h2', { text: 'Settings' }), FIELDS.map(function (f) {
      var el;
      if (f[2] === 'select') { el = h('select', { id: 'f-' + f[0] }, f[3].map(function (v) { return h('option', { value: String(v), selected: s.settings[f[0]] === v ? 'selected' : null }, String(v)); })); }
      else if (f[2] === 'bool') { el = h('input', { type: 'checkbox', id: 'f-' + f[0] }); el.checked = !!s.settings[f[0]]; }
      else { el = h('input', { type: 'number', id: 'f-' + f[0], value: String(s.settings[f[0]]), style: 'width:100px', inputmode: 'numeric' }); }
      inputs[f[0]] = { el: el, kind: f[2] };
      return h('label', { class: 'field', for: 'f-' + f[0] }, h('span', { text: f[1] }), el);
    }));
    var save = h('button', { class: 'btn primary' }, 'Save settings');
    save.addEventListener('click', function () {
      var out = {};
      Object.keys(inputs).forEach(function (k) {
        var i = inputs[k];
        out[k] = i.kind === 'bool' ? i.el.checked : Number(i.el.value);
      });
      act(save, call('apiSaveSettings', out), 'Saved.').catch(function () {});
    });
    add(form, h('div', { class: 'row end' }, save));
    show(form, keysCard(s.keys), listCard('allow', 'Trusted senders', 'Never flagged, but dangerous attachments are still caught.', s.allow),
      listCard('block', 'Blocked senders', 'New emails from these go straight to Trash.', s.block), offCard());
  }).catch(failed);
}
function keysCard(keys) {
  function keyRow(which, label, help) {
    var input = h('input', { type: 'password', autocomplete: 'off', spellcheck: 'false', placeholder: keys[which] || 'Not set', 'aria-label': label, class: 'grow' });
    var eye = h('button', { class: 'btn', type: 'button', 'aria-pressed': 'false', 'aria-label': 'Show key' }, 'Show');
    eye.addEventListener('click', function () {
      var showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      eye.textContent = showing ? 'Show' : 'Hide';
      eye.setAttribute('aria-pressed', String(!showing));
      eye.setAttribute('aria-label', showing ? 'Show key' : 'Hide key');
    });
    var saveBtn = h('button', { class: 'btn' }, 'Save');
    saveBtn.addEventListener('click', function () {
      act(saveBtn, call('apiSetKey', which, input.value), function (m) { return m ? 'Saved: ' + m : 'Removed.'; })
        .then(function (m) { input.value = ''; input.placeholder = m || 'Not set'; input.type = 'password'; eye.textContent = 'Show'; }).catch(function () {});
    });
    return h('div', { class: 'item' }, h('div', { class: 'subject', text: label }), h('p', { class: 'muted small', text: help }),
      h('div', { class: 'secret' }, input, eye, saveBtn));
  }
  return h('div', { class: 'card' }, h('h2', { text: 'Extra checks (optional)' }),
    h('p', { class: 'muted small', text: 'Free keys add a second opinion. They are stored in your Google account and never shown again. Save an empty box to remove a key.' }),
    keyRow('virustotal', 'VirusTotal key', 'Checks attachments against 70+ antivirus engines.'),
    keyRow('safebrowsing', 'Google Safe Browsing key', "Checks links against Google's list of dangerous sites."));
}
function listCard(which, title, help, items) {
  var input = h('input', { type: 'text', placeholder: 'name@site.com or @site.com', 'aria-label': 'Add to ' + title, class: 'grow' });
  var addBtn = h('button', { class: 'btn' }, 'Add');
  addBtn.addEventListener('click', function () {
    act(addBtn, call('apiUpdateList', which, 'add', input.value), 'Added.').then(renderSettings).catch(function () {});
  });
  return h('div', { class: 'card' }, h('h2', { text: title }), h('p', { class: 'muted small', text: help }),
    h('div', { class: 'row' }, input, addBtn),
    items.map(function (e) {
      return h('div', { class: 'item row' }, h('span', { class: 'grow from', text: e }),
        button('Remove', '', function (b) { return act(b, call('apiUpdateList', which, 'remove', e), 'Removed.'); }, renderSettings));
    }));
}
function offCard() {
  var b = h('button', { class: 'btn danger' }, 'Turn protection off');
  b.addEventListener('click', function () {
    confirmBox('Turn protection off?', 'Your inbox will no longer be checked. Run "setup" in Apps Script to switch it on again.', 'Turn off', true)
      .then(function (ok) { if (ok) act(b, call('apiTurnOff'), 'Protection is off.').then(renderHome).catch(function () {}); });
  });
  return h('div', { class: 'card' }, h('h2', { text: 'Switch off' }), b);
}

/* ---------- Tabs ---------- */
var RENDER = { home: renderHome, quarantine: renderQuarantine, review: renderReview, websites: function () { renderWebsites(false); }, outbox: renderOutbox, settings: renderSettings };
function go(tab) {
  state.tab = RENDER[tab] ? tab : 'home';
  Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === state.tab)); });
  RENDER[state.tab]();
}
function refresh() { if (state.tab === 'websites') renderWebsites(true); else go(state.tab); }
Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) {
  b.addEventListener('click', function () { go(b.getAttribute('data-tab')); });
});
go('home');
</script>
</body>
</html>
